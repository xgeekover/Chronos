server {
    listen 80;

    # REST API → backend (same-origin from the browser, so no CORS).
    location /api/ {
        proxy_pass http://backend:8080/api/;
    }

    # WebSocket gateway → backend (upgrade headers for WS).
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # keep idle gateway subscriptions alive (nginx default read timeout is 60s → dropped sockets)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Fingerprinted build assets (Vite hashes the filename on every content change),
    # so they can be cached forever — a new deploy ships new filenames, never stale ones.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA fallback. index.html must NOT be cached: it references the hashed asset
    # filenames, so the browser has to re-fetch it to discover a new deploy's chunks.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
