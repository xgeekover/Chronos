[versions]
# Plugins
springBoot = "4.0.7"
springDepMgmt = "1.1.7"
# Libraries not managed by the Spring Boot BOM
pf4j = "3.15.0"
junit = "6.1.0"
sqlite = "3.53.2.0"
mariadb = "3.5.9"
ojdbc = "23.26.2.0.0"
mssql = "13.4.0.jre11"
hikari = "7.0.2"
jsonpath = "2.10.0"
sshd = "2.18.0"
protobuf = "4.35.1"
protobufPlugin = "0.10.0"
paho = "1.2.5"
j2mod = "3.2.1"
jgit = "6.10.0.202406032230-r"
graaljs = "24.1.1"
jackson = "2.18.2"
snakeyaml = "2.3"
jsoup = "1.18.1"

[libraries]
pf4j = { module = "org.pf4j:pf4j", version.ref = "pf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
mariadb-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
ojdbc11 = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "ojdbc" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
json-path = { module = "com.jayway.jsonpath:json-path", version.ref = "jsonpath" }
sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
paho-mqtt = { module = "org.eclipse.paho:org.eclipse.paho.client.mqttv3", version.ref = "paho" }
j2mod = { module = "com.ghgande:j2mod", version.ref = "j2mod" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
graaljs-polyglot = { module = "org.graalvm.polyglot:polyglot", version.ref = "graaljs" }
graaljs-js = { module = "org.graalvm.polyglot:js-community", version.ref = "graaljs" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dep-mgmt = { id = "io.spring.dependency-management", version.ref = "springDepMgmt" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
