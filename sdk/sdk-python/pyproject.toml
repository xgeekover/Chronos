[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronos-sdk"
version = "0.1.0"
description = "Chronos IoT historian gateway client — subscribe to and query tags by name over WebSocket (§9)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Chronos" }]
keywords = ["iot", "historian", "timeseries", "scada", "chronos"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "protobuf>=5.27",
  "websocket-client>=1.7",
]

[project.urls]
Homepage = "https://github.com/your-org/chronos"
Source = "https://github.com/your-org/chronos/tree/main/sdk/sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["chronos_sdk"]

[tool.hatch.build.targets.sdist]
include = ["chronos_sdk", "README.md"]
